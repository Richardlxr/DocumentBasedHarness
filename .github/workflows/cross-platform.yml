name: Cross-platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: Repository privacy guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python scripts/check_release_privacy.py

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04-arm
            python-version: "3.13"
          - os: windows-2025
            python-version: "3.11"
          - os: windows-2025
            python-version: "3.13"
          - os: windows-11-arm
            python-version: "3.13"
          - os: macos-15-intel
            python-version: "3.13"
          - os: macos-15
            python-version: "3.11"
          - os: macos-15
            python-version: "3.13"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux font prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check . --no-cache
