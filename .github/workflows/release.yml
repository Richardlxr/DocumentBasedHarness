name: Native release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux font prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
      - name: Install build dependencies
        run: python -m pip install -e ".[dev,release]"
      - name: Privacy guard
        run: python scripts/check_release_privacy.py
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check . --no-cache
      - name: Build and smoke-test standalone bundle
        run: python scripts/build_standalone.py --output release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            release/DocumentBasedHarness-*.zip
            release/DocumentBasedHarness-*.tar.gz
            release/DocumentBasedHarness-*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build-native
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Consolidate checksums
        shell: bash
        run: |
          cd release
          sha256sum DocumentBasedHarness-*.zip \
            DocumentBasedHarness-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
